<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crove CF v3.2 部署器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:42px 20px}.wrap{max-width:850px;margin:auto}
h1{margin:0;font-size:30px}header p{color:#d1d5db}main{padding:22px 15px 50px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px}
h2{margin:0 0 15px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-size:13px;color:#4b5563}input{width:100%;margin-top:6px;padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
button{border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.log{white-space:pre-wrap;background:#f3f4f6;padding:13px;border-radius:10px;font-size:13px;line-height:1.7}
.warn{background:#fffbeb;color:#92400e}.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px;background:#f7f8fa;border-radius:10px;margin:7px 0;font-size:13px}.mono{font-family:ui-monospace,monospace;word-break:break-all}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚡ Crove CF v3.2 部署器</h1><p>仅负责部署 Pages / Worker / KV，不进行 IP 优选或测速</p></div></header>
<main class="wrap">
<div class="card"><h2>🔐 Cloudflare 认证</h2><div class="grid">
<label>Cloudflare 邮箱<input id="email" type="email" autocomplete="off"></label>
<label>Global API Key<input id="key" type="password" autocomplete="new-password"></label>
<label>Account ID（可选）<input id="account" autocomplete="off"></label>
</div>
<div class="actions"><button onclick="verify()">验证账号</button></div>
<div class="log warn">Global API Key 仅用于当前请求，不写入 localStorage、sessionStorage、Cookie、URL 或 KV。离开页面时清空输入框。</div></div>
<div class="card"><h2>⚙️ 部署设置</h2><div class="grid">
<label>Pages 项目名<input id="pagesName" value="crove-cf-v32"></label>
<label>Worker 名称<input id="workerName" value="crove-cf-v32-worker"></label>
<label>KV 名称<input id="kvName" value="CROVE_CF_NODES_V32"></label>
</div><div class="actions"><button id="deployBtn" onclick="deploy()">🚀 开始部署</button></div></div>
<div class="card"><h2>📋 部署日志</h2><div id="log" class="log">等待操作…</div></div>
<div class="card"><h2>🔗 部署结果</h2><div id="result"><div class="row"><b>Pages</b><span class="mono">-</span></div><div class="row"><b>Worker</b><span class="mono">-</span></div><div class="row"><b>KV</b><span class="mono">-</span></div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
function setLog(t,c=""){let e=$("log");e.className="log "+c;e.textContent=t}
async function callAPI(path,data={}){let r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),key:$("key").value.trim(),...data})});let d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||("HTTP "+r.status));return d}
async function verify(){try{setLog("正在验证 Cloudflare 账号…");let d=await callAPI("verify");setLog("验证成功："+(d.email||$("email").value.trim()),"ok")}catch(e){setLog("验证失败："+e.message,"err")}}
async function deploy(){let b=$("deployBtn");b.disabled=true;try{
if(!$("email").value.trim()||!$("key").value.trim())throw Error("请填写邮箱和 Global API Key");
setLog("① 验证 Cloudflare 账号…");await callAPI("verify");
let a=$("account").value.trim();
if(!a){setLog("① 验证成功\n② 获取 Account ID…");a=(await callAPI("account")).accountId}else setLog("① 验证成功\n② 使用指定 Account ID："+a);
setLog("③ 创建/复用 KV…");let k=await callAPI("kv",{accountId:a,title:$("kvName").value.trim()});setLog("③ KV 完成："+k.kvId,"ok");
setLog("④ 部署 Worker…");let w=await callAPI("worker",{accountId:a,workerName:$("workerName").value.trim(),kvId:k.kvId});setLog("④ Worker 完成："+w.workerUrl,"ok");
setLog("⑤ 创建/部署 Pages…");let p=await callAPI("pages",{accountId:a,projectName:$("pagesName").value.trim()});setLog("⑤ Pages 完成："+p.pagesUrl,"ok");
$("result").innerHTML='<div class="row"><b>Pages</b><span class="mono">'+p.pagesUrl+'</span></div><div class="row"><b>Worker</b><span class="mono">'+w.workerUrl+'</span></div><div class="row"><b>KV</b><span class="mono">'+k.kvId+'</span></div>';
setLog("部署流程完成。","ok");
}catch(e){setLog("部署失败："+e.message,"err")}finally{b.disabled=false}}
addEventListener("pagehide",()=>{$("email").value="";$("key").value=""});
addEventListener("beforeunload",()=>{$("email").value="";$("key").value=""});
</script></body></html>
