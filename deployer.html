<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crove CF v3.2 纯部署器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:42px 18px}.wrap{max-width:820px;margin:auto}main{padding:20px 14px 50px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #0000000a}
h1{margin:0;font-size:30px}h2{font-size:20px;margin:0 0 15px}header p{color:#d1d5db}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-size:13px;color:#4b5563}
input{width:100%;margin-top:6px;padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
button{border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.log{white-space:pre-wrap;background:#f3f4f6;padding:13px;border-radius:10px;font-size:13px;line-height:1.7}
.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}.warn{background:#fffbeb;color:#92400e}
.row{display:flex;justify-content:space-between;gap:12px;background:#f7f8fa;padding:11px;border-radius:9px;margin:7px 0;font-size:13px}.mono{font-family:ui-monospace,monospace;word-break:break-all}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚡ Crove CF v3.2</h1><p>纯部署器 · Pages + Functions + Worker + KV</p></div></header>
<main class="wrap">
<div class="card">
<h2>🔐 Cloudflare 认证</h2>
<div class="grid">
<label>Cloudflare 邮箱<input id="email" type="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="name@example.com"></label>
<label>Global API Key<input id="key" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="Global API Key"></label>
<label>Account ID（可选）<input id="account" autocomplete="off" spellcheck="false" placeholder="多个账户时填写"></label>
</div>
<div class="actions"><button onclick="verify()">🔎 验证账号</button></div>
<div class="log warn">本页面只负责部署，不包含 IP 优选、测速、Mbps 或节点操作。Key 不写入 localStorage、sessionStorage、Cookie、URL 或 KV。</div>
</div>
<div class="card">
<h2>⚙️ 部署参数</h2>
<div class="grid">
<label>Pages 项目名<input id="pages" value="crove-cf-v32" autocomplete="off"></label>
<label>Worker 名称<input id="worker" value="crove-cf-v32-worker" autocomplete="off"></label>
<label>KV 名称<input id="kv" value="CROVE_CF_NODES_V32" autocomplete="off"></label>
</div>
<div class="actions"><button id="go" onclick="deploy()">🚀 开始部署</button></div>
</div>
<div class="card"><h2>📋 部署日志</h2><div id="log" class="log">等待操作…</div></div>
<div class="card"><h2>🔗 部署结果</h2><div id="out">
<div class="row"><b>Pages</b><span class="mono">-</span></div>
<div class="row"><b>Worker</b><span class="mono">-</span></div>
<div class="row"><b>KV</b><span class="mono">-</span></div>
</div></div>
</main>
<script>
const $=id=>document.getElementById(id);
function log(s,c=""){let e=$("log");e.className="log "+c;e.textContent+=(e.textContent==="等待操作…"?"":"\n")+s}
async function api(path,body={}){let r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),key:$("key").value.trim(),...body})});let d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||"HTTP "+r.status);return d}
async function verify(){ $("log").textContent="";try{let d=await api("verify");log("验证成功："+(d.email||$("email").value),"ok")}catch(e){log("验证失败："+e.message,"err")}}
async function deploy(){
let b=$("go");b.disabled=true;$("log").textContent="";
try{
if(!$("email").value.trim()||!$("key").value.trim())throw Error("请填写邮箱和 Global API Key");
log("① 验证 Cloudflare 账号…");await api("verify");
let a=$("account").value.trim();if(!a){log("② 获取 Account ID…");a=(await api("account")).accountId}else log("② 使用填写的 Account ID："+a);
log("③ 创建/复用 KV…");let k=await api("kv",{accountId:a,title:$("kv").value.trim()||"CROVE_CF_NODES_V32"});log("KV ID："+k.kvId,"ok");
log("④ 部署 Worker…");let w=await api("worker",{accountId:a,workerName:$("worker").value.trim()||"crove-cf-v32-worker",kvId:k.kvId});log("Worker："+w.workerUrl,"ok");
log("⑤ 创建 Pages 项目…");let p=await api("pages",{accountId:a,projectName:$("pages").value.trim()||"crove-cf-v32"});log("Pages："+p.pagesUrl,"ok");
$("out").innerHTML='<div class="row"><b>Pages</b><span class="mono">'+p.pagesUrl+'</span></div><div class="row"><b>Worker</b><span class="mono">'+w.workerUrl+'</span></div><div class="row"><b>KV</b><span class="mono">'+k.kvId+'</span></div>';
log("部署流程完成。","ok");
}catch(e){log("部署失败："+e.message,"err")}finally{b.disabled=false}
}
addEventListener("pagehide",()=>{$("key").value="";$("email").value=""});
addEventListener("beforeunload",()=>{$("key").value="";$("email").value=""});
</script>
</body>
</html>
