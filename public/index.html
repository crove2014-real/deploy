<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crove CF v3.4 Pure Pages</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{background:#111827;color:#fff;padding:38px 18px}.wrap{max-width:900px;margin:auto}main{padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:20px;margin-bottom:16px}h1{margin:0}h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{font-size:13px;color:#4b5563}input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #d1d5db;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:#111827;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.log{white-space:pre-wrap;background:#f3f4f6;border-radius:9px;padding:12px;min-height:65px;font-size:13px;line-height:1.7}.warn{background:#fffbeb;color:#92400e}.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}.row{display:flex;justify-content:space-between;gap:10px;background:#f7f8fa;padding:10px;border-radius:9px;margin:7px 0}.mono{font-family:monospace;word-break:break-all}</style></head><body>
<header><div class="wrap"><h1>⚡ Crove CF v3.4 Pure Pages</h1><p>cfnew-deployer 风格 · 单 Pages 项目</p></div></header><main class="wrap">
<div class="card"><h2>🔐 Cloudflare 认证</h2><div class="grid"><label>邮箱<input id="email" type="email" autocomplete="off"></label><label>Global API Key<input id="key" type="password" autocomplete="new-password"></label><label>Account ID（可选）<input id="account" autocomplete="off"></label></div><div class="actions"><button id="verify">🔎 验证账户</button><button id="res">📋 获取资源</button></div><div class="log warn">Key 只随当前请求使用，不保存到 localStorage、Cookie、KV 或文件。</div></div>
<div class="card"><h2>🚀 部署</h2><div class="grid"><label>目标<select id="target"><option value="pages">Pages + Functions</option><option value="worker">Worker</option><option value="both">Pages + Worker</option></select></label><label>Pages 项目名<input id="pages" value="crove-cf-v34"></label><label>Worker 名称<input id="workerName" value="crove-cf-v34-worker"></label><label>KV 名称<input id="kv" value="CROVE_NODES"></label></div><div class="actions"><button id="deploy">🚀 一键部署</button></div></div>
<div class="card"><h2>📋 状态</h2><div id="log" class="log">等待操作…</div></div><div class="card"><h2>🔗 结果</h2><div id="result" class="log">—</div></div></main>
<script>
const $=id=>document.getElementById(id);const credentials=()=>({email:$("email").value.trim(),key:$("key").value.trim()});
function show(t,c=""){let e=$("log");e.className="log "+c;e.textContent=t}
async function api(path,payload){let r;try{r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},cache:"no-store",body:JSON.stringify(payload)})}catch(e){throw Error("网络请求失败："+(e.message||"Load failed"))}let text=await r.text(),d;try{d=JSON.parse(text)}catch{throw Error("HTTP "+r.status+"：服务器返回非 JSON："+text.slice(0,120))}if(!r.ok||d.ok===false)throw Error(d.error||("HTTP "+r.status));return d}
$("verify").onclick=async()=>{let b=$("verify");b.disabled=true;show("正在连接 Cloudflare API…");try{let d=await api("accounts",{credentials:credentials()});if(!d.accounts.length)throw Error("没有可用 Account");$("account").value=d.accounts[0].id;show("✅ 验证成功\n账户："+d.accounts[0].name+"\nAccount ID："+d.accounts[0].id,"ok")}catch(e){show("❌ 验证失败\n"+e.message,"err")}finally{b.disabled=false}};
$("res").onclick=async()=>{try{let a=$("account").value.trim();if(!a){let d=await api("accounts",{credentials:credentials()});a=d.accounts[0]?.id;if(!a)throw Error("没有可用 Account");$("account").value=a}let d=await api("resources",{credentials:credentials(),accountId:a});show("Workers\n"+(d.workers.join("\n")||"无")+"\n\nPages\n"+(d.pages.join("\n")||"无")+"\n\nKV\n"+(d.kv.join("\n")||"无"),"ok")}catch(e){show("❌ 获取资源失败\n"+e.message,"err")}};
$("deploy").onclick=async()=>{let b=$("deploy");b.disabled=true;try{let c=credentials();if(!c.email||!c.key)throw Error("请填写邮箱和 Global API Key");let a=$("account").value.trim();if(!a){let x=await api("accounts",{credentials:c});a=x.accounts[0]?.id;if(!a)throw Error("没有可用 Account");$("account").value=a}show("① 验证完成\n② 创建/复用 KV…");let d=await api("deploy",{credentials:c,accountId:a,target:$("target").value,pagesName:$("pages").value.trim(),workerName:$("workerName").value.trim(),kvName:$("kv").value.trim()});show(d.logs.join("\n"),"ok");$("result").textContent="Pages: "+(d.pagesUrl||"-")+"\nWorker: "+(d.workerUrl||"-")+"\nKV: "+(d.kvId||"-")}catch(e){show("❌ 部署失败\n"+e.message,"err")}finally{b.disabled=false}};
addEventListener("pagehide",()=>{$("email").value="";$("key").value=""});
</script></body></html>
