<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crove CF v3.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:38px 18px}.wrap{max-width:960px;margin:auto}
main{padding:20px 14px 50px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:16px}
h1{margin:0;font-size:29px}h2{font-size:19px;margin:0 0 14px}header p{color:#d1d5db}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-size:13px;color:#4b5563}
input,select{width:100%;margin-top:6px;padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
button{border:0;border-radius:10px;padding:11px 16px;background:#111827;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.log{white-space:pre-wrap;background:#f3f4f6;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}
.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}.warn{background:#fffbeb;color:#92400e}
.bar{height:8px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#111827}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px;background:#f7f8fa;border-radius:9px;margin:6px 0;font-size:13px}.mono{font-family:ui-monospace,monospace;word-break:break-all}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚡ Crove CF v3.2</h1><p>Cloudflare Pages Functions · IPv4 / IPv6 · 优选 · Mbps · Clash</p></div></header>
<main class="wrap">
<div class="card"><h2>🔐 Cloudflare 认证</h2>
<div class="grid">
<label>邮箱<input id="email" type="email" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
<label>Global API Key<input id="key" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false"></label>
</div>
<div class="actions"><button onclick="verify()">验证账号</button></div>
<div class="log warn">Key 仅用于当前请求，不写入 localStorage、sessionStorage、Cookie、URL 或 KV。建议使用完成后轮换 Global API Key。</div>
</div>

<div class="card"><h2>⚙️ 参数</h2>
<div class="grid">
<label>IP 类型<select id="type"><option value="both">IPv4 + IPv6</option><option value="ipv4">IPv4</option><option value="ipv6">IPv6</option></select></label>
<label>候选数量<select id="count"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></label>
<label>并发<select id="concurrency"><option>3</option><option selected>5</option><option>10</option><option>20</option></select></label>
<label>超时<select id="timeout"><option value="1000">1 秒</option><option value="2000" selected>2 秒</option><option value="3000">3 秒</option><option value="5000">5 秒</option></select></label>
<label>Top<select id="top"><option selected>10</option><option>20</option><option>50</option></select></label>
<label>端口<input id="port" value="443" inputmode="numeric"></label>
</div>
<div class="actions"><button onclick="loadIPs()">📡 获取官方 IP</button><button onclick="start()">🚀 开始优选</button><button onclick="stop()">⏹ 停止</button></div>
<div id="status" class="log">等待操作…</div><div class="bar"><i id="bar"></i></div>
</div>

<div class="card"><h2>📊 结果</h2>
<div id="stats" class="log">暂无结果</div>
<div class="actions"><button onclick="copyTop()">📋 复制 IP</button><button onclick="downloadTxt()">💾 导出 TXT</button><button onclick="save()">☁️ 保存到 KV</button></div>
<div id="table"></div>
</div>

<div class="card"><h2>🔗 Clash 订阅</h2>
<div class="row"><b>当前 Pages 订阅</b><span id="sub" class="mono">/api/sub</span></div>
<div class="actions"><button onclick="copySub()">复制订阅地址</button></div>
</div>
</main>
<script>
let cidr4=[],cidr6=[],candidates=[],results=[],stopFlag=false;
const $=id=>document.getElementById(id);
function msg(s,c=""){const e=$("status");e.className="log "+c;e.textContent=s}
function ip4n(s){return s.split(".").reduce((n,x)=>(n*256+ +x)>>>0,0)}
function n4ip(n){return[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join(".")}
function rand4(c){let[a,p]=c.split("/"),bits=32-+p,max=2**bits,base=ip4n(a),mask=p==0?0:(0xffffffff<<bits)>>>0;let net=base&mask;let off=max<=2?0:1+Math.floor(Math.random()*(max-2));return n4ip((net+off)>>>0)}
function hex(){return Math.floor(Math.random()*65536).toString(16).padStart(4,"0")}
function rand6(c){let [a,p]=c.split("/"),g=a.split(":");if(a.includes("::")){let i=g.indexOf(""),m=8-(g.length-1);g=[...g.slice(0,i),...Array(m).fill("0"),...g.slice(i+1)]}while(g.length<8)g.push("0");let pg=Math.floor(+p/16);return g.map((x,i)=>i<pg?(x||"0"):hex()).join(":")}
async function api(path,body={}){let r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),key:$("key").value.trim(),...body})});let d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||"HTTP "+r.status);return d}
async function verify(){try{let d=await api("verify");msg("验证成功："+(d.email||$("email").value),"ok")}catch(e){msg("验证失败："+e.message,"err")}}
async function loadIPs(){try{msg("正在获取 Cloudflare 官方 IP…");let d=await api("ips");cidr4=d.result.ipv4_cidrs||[];cidr6=d.result.ipv6_cidrs||[];msg("获取成功：IPv4 "+cidr4.length+" 个，IPv6 "+cidr6.length+" 个","ok")}catch(e){msg("获取失败："+e.message,"err")}}
function make(){let type=$("type").value,n=+$("count").value,list=[];if(type!="ipv6")list.push(...cidr4.map(x=>({type:"IPv4",cidr:x})));if(type!="ipv4")list.push(...cidr6.map(x=>({type:"IPv6",cidr:x})));list.sort(()=>Math.random()-.5);candidates=[];for(let i=0;i<n&&list.length;i++){let x=list[i%list.length];candidates.push({ip:x.type==="IPv4"?rand4(x.cidr):rand6(x.cidr),type:x.type,cidr:x.cidr,port:+$("port").value||443})}}
async function test(x){let t=+$("timeout").value;let target="/api/trace?ip="+encodeURIComponent(x.ip);let ac=new AbortController(),timer=setTimeout(()=>ac.abort(),t),s=performance.now();try{let r=await fetch(target,{cache:"no-store",signal:ac.signal});let d=await r.json();clearTimeout(timer);if(!r.ok||d.success===false)throw Error();return {...x,latency:Math.round(performance.now()-s),speed:+d.speed||0,alive:true}}catch(e){clearTimeout(timer);return {...x,alive:false}}}
async function start(){if(!cidr4.length&&!cidr6.length)await loadIPs();if(!cidr4.length&&!cidr6.length)return;make();results=[];stopFlag=false;let total=candidates.length,done=0,idx=0,alive=0;msg("开始测试 "+total+" 个候选 IP…");$("table").innerHTML="";$("stats").textContent="已测试 0 / "+total;async function w(){while(!stopFlag){let i=idx++;if(i>=total)return;let r=await test(candidates[i]);done++;if(r.alive){results.push(r);alive++}$("bar").style.width=Math.round(done/total*100)+"%";$("stats").textContent="已测试 "+done+" / "+total+" · 可用 "+alive;render()}}let ws=[];for(let i=0;i<Math.min(+$("concurrency").value,total);i++)ws.push(w());await Promise.all(ws);if(stopFlag)msg("测试已停止："+done+"/"+total);else msg("测试完成："+alive+"/"+total,"ok");render()}
function stop(){stopFlag=true}
function render(){results.sort((a,b)=>a.latency-b.latency);let list=results.slice(0,+$("top").value);$("table").innerHTML=list.length?'<div>'+list.map((x,i)=>'<div class="row"><span><b>#'+(i+1)+'</b> <span class="mono">'+x.ip+'</span> · '+x.type+'</span><span>'+x.latency+' ms · '+(x.speed||0)+' Mbps</span></div>').join("")+'</div>':"暂无可用结果"}
function copyTop(){let t=results.slice(0,+$("top").value).map(x=>x.ip).join("\n");if(!t)return alert("暂无结果");navigator.clipboard.writeText(t);alert("已复制")}
function downloadTxt(){let t=results.slice(0,+$("top").value).map(x=>x.ip+"#"+x.type+"#"+x.latency+"ms#"+(x.speed||0)+"Mbps").join("\n");if(!t)return alert("暂无结果");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"}));a.download="crove-cf-best-ip.txt";a.click()}
async function save(){if(!results.length)return alert("暂无结果");try{await api("save",{nodes:results.slice(0,+$("top").value)});alert("已保存到 KV")}catch(e){alert("保存失败："+e.message)}}
function copySub(){let u=location.origin+"/api/sub";navigator.clipboard.writeText(u);alert("已复制："+u)}
$("sub").textContent=location.origin+"/api/sub";
</script>
</body></html>
