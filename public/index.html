<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crove CF 优选 IP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:40px 18px}.wrap{max-width:1000px;margin:auto}
main{padding:20px 14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px}
h1{margin:0;font-size:30px}h2{margin:0 0 14px;font-size:20px}header p{color:#d1d5db}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-size:13px;color:#4b5563}
select,input{width:100%;margin-top:6px;padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
button{border:0;border-radius:10px;padding:11px 16px;background:#111827;color:#fff;font:inherit}button:disabled{opacity:.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.status{padding:12px;background:#f3f4f6;border-radius:10px;font-size:13px;margin-top:12px}
.progress{height:8px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:12px}.progress i{display:block;width:0;height:100%;background:#111827}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px;background:#f7f8fa;border-radius:10px;margin:6px 0;font-size:13px}.mono{font-family:ui-monospace,monospace;word-break:break-all}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚡ Crove CF 优选 IP</h1><p>Cloudflare 官方 IPv4 / IPv6 · 延迟测试 · Mbps 报告 · Clash</p></div></header>
<main class="wrap">
<div class="card"><h2>⚙️ 测试设置</h2><div class="grid">
<label>IP 类型<select id="type"><option value="both">IPv4 + IPv6</option><option value="ipv4">IPv4</option><option value="ipv6">IPv6</option></select></label>
<label>候选数量<select id="count"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></label>
<label>并发<select id="conc"><option>3</option><option selected>5</option><option>10</option><option>20</option></select></label>
<label>超时<select id="timeout"><option value="1000">1 秒</option><option selected value="2000">2 秒</option><option value="3000">3 秒</option><option value="5000">5 秒</option></select></label>
<label>Top<select id="top"><option selected>10</option><option>20</option><option>50</option></select></label>
<label>端口<input id="port" value="443" inputmode="numeric"></label>
</div><div class="actions"><button onclick="loadIPs()">📡 获取官方 IP</button><button onclick="start()">🚀 开始测速</button><button onclick="stop()">⏹ 停止</button></div><div id="status" class="status">等待操作…</div><div class="progress"><i id="bar"></i></div></div>
<div class="card"><h2>📊 结果</h2><div id="stats">暂无结果</div><div id="table" style="margin-top:12px"></div><div class="actions"><button onclick="copyTop()">复制 Top IP</button><button onclick="downloadTxt()">导出 TXT</button><button onclick="saveKV()">保存到 KV</button></div></div>
<div class="card"><h2>🔗 Clash 订阅</h2><div class="row"><b>订阅地址</b><span id="sub" class="mono">-</span></div><button onclick="copySub()">复制订阅地址</button></div>
</main>
<script>
let c4=[],c6=[],cand=[],res=[],stopFlag=false;
const $=x=>document.getElementById(x);
async function api(path,opt={}){let r=await fetch("/api/"+path,opt);let d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||"HTTP "+r.status);return d}
function ip4n(s){return s.split(".").reduce((n,x)=>(n*256+ +x)>>>0,0)}function n4(n){return[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join(".")}
function r4(c){let[a,p]=c.split("/"),b=ip4n(a),bits=32-+p,m=2**bits,mask=p==0?0:(0xffffffff<<bits)>>>0;let net=b&mask;return n4((net+(m<=2?0:1+Math.floor(Math.random()*(m-2))))>>>0)}
function hx(){return Math.floor(Math.random()*65536).toString(16).padStart(4,"0")}
function r6(c){let[a,p]=c.split("/"),g=a.split(":");if(a.includes("::")){let i=g.indexOf(""),m=8-(g.length-1);g=[...g.slice(0,i),...Array(m).fill("0"),...g.slice(i+1)]}while(g.length<8)g.push("0");let pg=Math.floor(+p/16);return g.map((x,i)=>i<pg?(x||"0"):hx()).join(":")}
async function loadIPs(){try{$("status").textContent="正在获取 Cloudflare 官方 IP…";let d=await api("ips");c4=d.result.ipv4_cidrs||[];c6=d.result.ipv6_cidrs||[];$("status").textContent="获取成功：IPv4 "+c4.length+" 个，IPv6 "+c6.length+" 个"}catch(e){$("status").textContent="获取失败："+e.message}}
function make(){let t=$("type").value,l=[];if(t!="ipv6")l.push(...c4.map(c=>({t:"IPv4",c})));if(t!="ipv4")l.push(...c6.map(c=>({t:"IPv6",c})));l.sort(()=>Math.random()-.5);cand=[];for(let i=0;i<+$("count").value&&l.length;i++){let x=l[i%l.length];cand.push({ip:x.t==="IPv4"?r4(x.c):r6(x.c),type:x.t,port:+$("port").value||443})}}
async function one(x){let ac=new AbortController(),tm=setTimeout(()=>ac.abort(),+$("timeout").value),s=performance.now();try{let d=await api("trace?ip="+encodeURIComponent(x.ip),{signal:ac.signal});clearTimeout(tm);return {...x,latency:Math.round(performance.now()-s),speed:+d.speed||0,alive:true}}catch(e){clearTimeout(tm);return {...x,alive:false}}}
async function start(){if(!c4.length&&!c6.length)await loadIPs();if(!c4.length&&!c6.length)return;make();res=[];stopFlag=false;let i=0,done=0,total=cand.length;async function w(){while(!stopFlag){let n=i++;if(n>=total)return;let r=await one(cand[n]);done++;if(r.alive)res.push(r);$("bar").style.width=Math.round(done/total*100)+"%";$("stats").textContent="已测试 "+done+"/"+total+" · 可用 "+res.length;render()}}await Promise.all(Array.from({length:Math.min(+$("conc").value,total)},w));$("status").textContent=stopFlag?"测试已停止":"测试完成";render()}
function stop(){stopFlag=true}
function render(){res.sort((a,b)=>a.latency-b.latency);let a=res.slice(0,+$("top").value);$("table").innerHTML=a.length?a.map((x,i)=>'<div class="row"><span>#'+(i+1)+'　<span class="mono">'+x.ip+'</span>　'+x.type+'</span><span>'+x.latency+' ms · '+x.speed+' Mbps</span></div>').join(""):"暂无可用结果"}
function copyTop(){let s=res.slice(0,+$("top").value).map(x=>x.ip).join("\\n");if(!s)return alert("暂无结果");navigator.clipboard.writeText(s);alert("已复制")}
function downloadTxt(){let s=res.slice(0,+$("top").value).map(x=>x.ip+"#"+x.type+"#"+x.latency+"ms#"+x.speed+"Mbps").join("\\n");if(!s)return alert("暂无结果");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/plain"}));a.download="crove-cf-best-ip.txt";a.click()}
async function saveKV(){if(!res.length)return alert("暂无结果");try{await api("save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nodes:res.slice(0,+$("top").value)})});alert("已保存")}catch(e){alert("保存失败："+e.message)}}
function copySub(){navigator.clipboard.writeText(location.origin+"/api/sub");alert("已复制")}
$("sub").textContent=location.origin+"/api/sub";
</script></body></html>
